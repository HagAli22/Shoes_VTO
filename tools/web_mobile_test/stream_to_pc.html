<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shoes VTO — PC GPU Live Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      background: rgba(15, 15, 20, 0.85); border-radius: 12px; padding: 10px 14px;
      backdrop-filter: blur(10px); border: 1px solid rgba(0, 240, 255, 0.3); z-index: 10;
    }
    .hud-title { font-weight: 700; color: #00f0ff; font-size: 15px; }
    .hud-row { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; color: #aaa; }
    .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; background: #00ff75; color: #000; font-size: 11px; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="hud-title">⚡ PC GPU Streaming (Quadro P2000)</div>
        <span class="badge" id="conn-badge">CONNECTING...</span>
      </div>
      <div class="hud-row">
        <span>GPU FPS: <b id="fps" style="color:#00ff75;">--</b></span>
        <span>GPU Latency: <b id="lat" style="color:#fff;">-- ms</b></span>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fpsElem = document.getElementById('fps');
    const latElem = document.getElementById('lat');
    const badge = document.getElementById('conn-badge');

    const offCanvas = document.createElement('canvas');
    offCanvas.width = 320;
    offCanvas.height = 320;
    const offCtx = offCanvas.getContext('2d');

    let ws = null;
    let isSending = false;

    function connectWS() {
      const loc = window.location;
      const wsProto = loc.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProto}//${loc.host}/ws_stream`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        badge.innerText = "GPU ONLINE";
        badge.style.background = "#00ff75";
      };

      ws.onclose = () => {
        badge.innerText = "DISCONNECTED";
        badge.style.background = "#ff3b30";
        setTimeout(connectWS, 2000);
      };

      ws.onmessage = (e) => {
        isSending = false;
        const data = JSON.parse(e.data);
        fpsElem.innerText = data.fps;
        latElem.innerText = `${data.latency} ms`;
        drawDetections(data.detections);
      };
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      sendLoop();
    }

    function sendLoop() {
      if (ws && ws.readyState === WebSocket.OPEN && !isSending && video.readyState >= 2) {
        offCtx.drawImage(video, 0, 0, 320, 320);
        const base64 = offCanvas.toDataURL('image/jpeg', 0.6).split(',')[1];
        ws.send(base64);
        isSending = true;
      }
      requestAnimationFrame(sendLoop);
    }

    function drawDetections(dets) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!dets) return;

      const sx = canvas.width / 320;
      const sy = canvas.height / 320;

      dets.forEach(d => {
        const color = d.cls === 0 ? '#00ff75' : '#ffaa00';
        const x1 = d.box[0] * sx, y1 = d.box[1] * sy;
        const x2 = d.box[2] * sx, y2 = d.box[3] * sy;

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        ctx.fillStyle = color;
        ctx.fillRect(x1, Math.max(0, y1 - 22), 110, 22);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(`${d.label} ${(d.conf * 100).toFixed(0)}%`, x1 + 6, Math.max(15, y1 - 6));

        if (d.kpts) {
          d.kpts.forEach(pt => {
            if (pt[2] > 0.2) {
              ctx.fillStyle = '#00f0ff';
              ctx.beginPath();
              ctx.arc(pt[0] * sx, pt[1] * sy, 5, 0, 2 * Math.PI);
              ctx.fill();
            }
          });
        }
      });
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    startCamera();
    connectWS();
  </script>
</body>
</html>
